name: Platform release

# The non-device train. Ships daily, reports nothing to Ketryx, has no design
# controls and no approval gate. It is here to make the asymmetry explicit:
# the same repository, a parallel pipeline, and deliberately no compliance step.
#
# Note what is NOT in this file: no Ketryx action, no eval gate, no risk review.
# If a change needs any of those, it belongs under device/ instead — moving the
# file is what moves it under design control.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'device/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Tag platform release
        run: |
          # Platform commits are everything outside device/**. Same
          # conventional-commit rules as the device train, separate counter.
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          LAST=${LAST:-0.0.0}
          RANGE=$([ "$LAST" = "0.0.0" ] && echo "HEAD" || echo "v${LAST}..HEAD")
          LOG=$(git log --format='%s%n%b' "$RANGE" -- . ':!device')
          if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then BUMP=minor
          elif echo "$LOG" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then BUMP=patch
          else echo "No platform release commits since v${LAST}; nothing to tag."; exit 0; fi
          VERSION="v$(npx -y semver -i "$BUMP" "$LAST")"
          git tag "$VERSION"
          git push origin "$VERSION"
