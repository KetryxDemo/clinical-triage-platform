name: Device release

# One repository, one Ketryx project, two release trains.
#
#   platform  ->  tags v*          daily, never enters design control
#   device    ->  tags device-v*   weekly, fully controlled
#
# The medical / non-medical boundary is drawn by PATH. Ketryx scans only
# device/** for configuration items, so platform code cannot become a
# controlled item no matter how often it ships. This workflow owns the device
# train and runs only when device-classified paths change.

on:
  push:
    branches: [main]
    paths:
      - 'device/**'
  workflow_dispatch:

env:
  KETRYX_PROJECT: ${{ secrets.KETRYX_PROJECT }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=junit --outputFile=unit-results.xml

      - name: Run device evaluations
        # The eval suite is the release gate: the urgent-presentation slice must
        # be fully green. A regression here fails the job, so no device tag is
        # ever cut from a build whose risk controls did not hold.
        run: npm run eval -- device/evals --reporter=junit --outputFile=eval-results.xml

      - name: Report unit tests to Ketryx
        if: always()
        uses: ketryx/ketryx-github-action@v1
        with:
          api-key: ${{ secrets.KETRYX_API_KEY }}
          ketryx-url: https://demo.ketryx.com
          project: ${{ env.KETRYX_PROJECT }}
          # The Ketryx version the evidence lands in. The sample pins the
          # current device version; a release pipeline would derive it from
          # the device-v* tag being cut.
          version: device-v1.1.0
          commit-sha: ${{ github.sha }}
          build-name: unit-tests
          test-junit-path: unit-results.xml

      - name: Report evaluations to Ketryx
        # if: always() so a FAILING eval is still recorded. The failed execution
        # is the evidence that the gate worked — dropping it on failure would
        # leave a gap in the record exactly where it matters most.
        if: always()
        uses: ketryx/ketryx-github-action@v1
        with:
          api-key: ${{ secrets.KETRYX_API_KEY }}
          ketryx-url: https://demo.ketryx.com
          project: ${{ env.KETRYX_PROJECT }}
          version: device-v1.1.0
          commit-sha: ${{ github.sha }}
          build-name: device-evaluations
          test-junit-path: eval-results.xml

  tag:
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive device semver from device-scoped commits
        id: semver
        run: |
          # Only commits touching device/** advance the device version, so the
          # device train does not inherit the platform's daily version churn.
          # Conventional commits decide the bump: feat -> minor, fix/perf ->
          # patch, a "!" or BREAKING CHANGE footer -> major.
          LAST=$(git tag -l 'device-v*' --sort=-v:refname | head -1 | sed 's/^device-v//')
          LAST=${LAST:-0.0.0}
          RANGE=$([ "$LAST" = "0.0.0" ] && echo "HEAD" || echo "device-v${LAST}..HEAD")
          LOG=$(git log --format='%s%n%b' "$RANGE" -- device/)
          if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then BUMP=minor
          elif echo "$LOG" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then BUMP=patch
          else echo "No device-scoped release commits since device-v${LAST}; nothing to tag."; echo "next=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "next=$(npx -y semver -i "$BUMP" "$LAST")" >> "$GITHUB_OUTPUT"

      - name: Tag device release
        if: steps.semver.outputs.next != ''
        run: |
          VERSION="device-v${{ steps.semver.outputs.next }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          # Ketryx watches refs/tags/device-v# on this repository and opens the
          # matching version. Everything under device/** enters it as a
          # configuration item; nothing under platform/** ever does.
